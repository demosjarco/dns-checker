name: Publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'adapters/**'
      - 'db/**'
      - 'dist/**'
      - 'do/**'
      - 'public/**'
      - 'src/**'
      - 'wf/**'
      - '*.config.*js'
      - '*.config.*ts'
      - 'wrangler.jsonc'
      - 'package*.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: https://dns.demosjarco.dev
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run-script install --if-present
      - name: Restore TS cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/.tsbuildinfo
          key: tsc-${{ github.ref_name }}-${{ hashFiles('tmp/.tsbuildinfo') }}
          restore-keys: |
            tsc-${{ github.ref_name }}-
          enableCrossOsArchive: true
      - run: npm run build.types
      - name: Save TS cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/.tsbuildinfo
          key: tsc-${{ github.ref_name }}-${{ hashFiles('tmp/.tsbuildinfo') }}
          enableCrossOsArchive: true
        background: true
      # Lint ignores `dist/*` & `server/*`, so it can run alongside the builds. Gated by `wait` before deploy
      - run: npm run lint
        id: lint
        background: true
      # Client output is deterministic from its inputs, so an exact hit skips the build. No `restore-keys`: vite empties `dist` before building, so a partial restore saves nothing
      - name: Restore client cache
        id: client_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/**
          key: qwik-${{ github.ref_name }}-c-${{ hashFiles('src/**', 'public/**', 'db/**', 'do/**', 'wf/**', '*.config.*js', '*.config.*ts', 'tsconfig.json', 'package-lock.json') }}
          enableCrossOsArchive: true
      - run: npm run build.client
        if: steps.client_cache.outputs.cache-hit != 'true'
        env:
          PUBLIC_GIT_HASH: ${{ github.sha }}
      # Not `background`: the server build writes SSG output into `dist` and would race the tarball
      - name: Save client cache
        if: steps.client_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/**
          key: ${{ steps.client_cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      # SSG bakes `GIT_HASH` into `dist/index.html` & `dist/q-data.json`, so this is per-commit (hits on re-runs). Caches `dist/**` too so a hit carries the SSG output
      - name: Restore server cache
        id: server_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/**
            dist/**
          key: qwik-${{ github.ref_name }}-s-${{ github.sha }}
          enableCrossOsArchive: true
      - run: npm run build.server
        if: steps.server_cache.outputs.cache-hit != 'true'
        env:
          GIT_HASH: ${{ github.sha }}
      - name: Save server cache
        if: steps.server_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/**
            dist/**
          key: ${{ steps.server_cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true
        background: true
      # Qwik build nukes `dist` folder. Restore back
      - run: git restore --source=HEAD --worktree --staged -- "dist/api/"
      - run: git restore --source=HEAD --worktree --staged -- "dist/dns.cf-apig.openapi.json"
      - run: git restore --source=HEAD --worktree --staged -- "dist/llms.txt"
      - run: git restore --source=HEAD --worktree --staged -- "dist/openapi.json"
      - run: git restore --source=HEAD --worktree --staged -- "dist/openapi31.json"
      - wait: lint
      - run: echo "wrangler_version=$(npm ls wrangler --depth=0 --json | jq -r '.dependencies.wrangler.version')" >> $GITHUB_OUTPUT
        id: npm_wrangler_version
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: wrangler
        with:
          wranglerVersion: ${{ steps.npm_wrangler_version.outputs.wrangler_version }}
          apiToken: ${{ secrets.WORKER_DEPLOY_CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          vars: |
            GIT_HASH
            CF_ACCOUNT_ID
          secrets: |
            CF_API_TOKEN
        env:
          GIT_HASH: ${{ github.sha }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
